# Windows için tek dosya EXE üretir (hedef bilgisayarda Python gerekmez).
# Çıktı: Actions → ilgili çalıştırma → Artifacts → PaintFormulationAI-windows
name: Windows EXE

on:
  workflow_dispatch:      # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]      # yalnızca main: aynı commit için çift derleme/çift mail olmasın

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıkları yükle
        run: python -m pip install -r requirements.txt

      - name: Birim testleri
        run: python -m pytest -q

      - name: EXE derle
        run: python -m PyInstaller --noconfirm --clean build_spec.spec

      - name: EXE'yi boş klasörde açıp kontrol et (duman testi)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist\PaintFormulationAI.exe $dir
          # Uygulama verilerini %LOCALAPPDATA%\PaintFormulationAI altına yazar
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'appdata'
          $dataDir = Join-Path $env:LOCALAPPDATA 'PaintFormulationAI'
          $p = Start-Process -FilePath "$dir\PaintFormulationAI.exe" -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 60
          $logs = Get-ChildItem "$dataDir\logs\*.log" -ErrorAction SilentlyContinue
          if ($logs) { Get-Content $logs | Select-Object -Last 25 }
          if ($p.HasExited) { Write-Error "Uygulama erken kapandı (çıkış kodu $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (-not $logs) { Write-Error 'Log dosyası oluşmadı'; exit 1 }
          if (-not (Select-String -Path $logs -Pattern 'Tüm başlangıç verileri yüklendi' -Quiet)) {
            Write-Error 'Başlangıç tamamlanmadı'; exit 1 }
          $errors = Select-String -Path $logs -Pattern ' - (ERROR|CRITICAL) - '
          if ($errors) { $errors; exit 1 }
          # EXE'nin bulunduğu klasöre (ör. masaüstü) klasör açılmamalı
          $extra = Get-ChildItem $dir | Where-Object { $_.Name -ne 'PaintFormulationAI.exe' }
          if ($extra) { Write-Error "EXE klasörüne beklenmeyen dosyalar yazıldı: $($extra.Name -join ', ')"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PaintFormulationAI-windows
          path: dist/PaintFormulationAI.exe
          retention-days: 30
